# General settings
name: train_HAT_SRx2_v4
model_type: HATModel
scale: 2
num_gpu: 1
manual_seed: 0

# Dataset and dataloader settings
datasets:
  train:
    name: SemiconTrain
    type: NpyDataset
    dataroot_gt: train/GT
    dataroot_lq: train/NoisyLR
    gt_size: 64  # reduce patch size to save VRAM (LQ patch size is 32)
    use_hflip: true
    use_rot: true
    
    # DataLoader settings
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

# Network structure
network_g:
  type: HAT
  upscale: 2
  in_chans: 1
  out_chans: 1
  img_size: 32
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  bkg_resolution: 32
  # Small model settings (for 6GB VRAM)
  depths: [6, 6, 6, 6]
  embed_dim: 96
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# Path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# Training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [100000, 200000]
    gamma: 0.5

  total_iter: 300000
  warmup_iter: -1  # no warm up

  # Losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# Validation settings (Empty because no separate validation folder yet)
val:
  val_freq: !!float 5e3
  save_img: false
  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 2
      test_y_channel: false

# Logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
